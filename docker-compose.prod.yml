services:
  db:
    image: postgis/postgis:17-3.5
    container_name: territorio_postgis_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-territorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-territorio}
      POSTGRES_DB: ${POSTGRES_DB:-territorio}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-territorio} -d ${POSTGRES_DB:-territorio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    container_name: territorio_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-territorio}:${POSTGRES_PASSWORD:-territorio}@db:5432/${POSTGRES_DB:-territorio}
      DATA_DIR: /app/data
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost,http://localhost:80}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: territorio_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata_prod:
