services:
  db:
    image: postgis/postgis:17-3.5
    container_name: territorio_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: territorio
      POSTGRES_PASSWORD: territorio
      POSTGRES_DB: territorio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U territorio -d territorio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: territorio_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
      - ./backend/alembic.ini:/app/alembic.ini
    environment:
      DATABASE_URL: postgresql+psycopg://territorio:territorio@db:5432/territorio
      DATA_DIR: /app/data
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: territorio_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
