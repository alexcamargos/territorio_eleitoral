  - code: turnout_pct
    label: "Comparecimento eleitoral"
    description: "Percentual de eleitores aptos que compareceram às urnas no 1º turno da Eleição Geral de 2026 (Presidente)."
    theme: electoral
    tier: 2
    unit: "%"
    value_type: continuous
    higher_is: neutral
    scale_hint: linear
    valid_range: [40.0, 100.0]
    source:
      adapter: derived
      params:
        table: "election_summary"
        office: "president"
        round: 1
        expr: "turnout / eligible_voters * 100"
      name: "TSE — Detalhe da Votação por Município e Zona (2026)"
      url: "https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_munzona/detalhe_votacao_munzona_2026.zip"
      license: "Dados públicos (TSE Dados Abertos)"
      citation: "TSE. Repositório de Dados Eleitorais — Eleições 2026."
    transform: null
    ref_year_policy: "fixed:2026"
    min_coverage: 1.0
    caveat: null
    verified: true

  - code: blank_null_pct
    label: "Votos brancos e nulos"
    description: "Percentual de votos em branco e nulos sobre o total de votos registrados no 1º turno de 2026 (Presidente)."
    theme: electoral
    tier: 2
    unit: "%"
