# Catálogo canônico de indicadores socioeconômicos, demográficos, fiscais e eleitorais.
# Fonte da verdade em runtime (ver docs/04-catalogo-de-indicadores.md e AGENTS.md).
#
# Regras inegociáveis:
# 1. `code` é imutável após publicação (contrato da API e de URLs compartilháveis).
# 2. `label` deve ter no máximo 32 caracteres (pt-BR).
# 3. `higher_is` ("better" | "worse" | "neutral") é usado APENAS em templates de texto,
#    NUNCA para atribuir cores vermelha/azul (reservadas ao espectro ideológico).
# 4. Indicadores com `verified: false` exigem `--allow-unverified` na carga de ETL.

schema_version: 1

themes:
  economy:
    label_pt: "Economia e renda"
    order: 1
  transfers:
    label_pt: "Transferências de renda"
    order: 2
  social:
    label_pt: "Social e demografia"
    order: 3
  education:
    label_pt: "Educação"
    order: 4
  health:
    label_pt: "Saúde"
    order: 5
  infrastructure:
    label_pt: "Infraestrutura urbana"
    order: 6
  fiscal:
    label_pt: "Gestão fiscal"
    order: 7
  composite:
    label_pt: "Índices compostos"
    order: 8
  electoral:
    label_pt: "Perfil eleitoral"
    order: 9

coverage_exceptions:
  - cd_ibge: 5101837
    name: "Boa Esperança do Norte"
    uf: "MT"
    installed_year: 2025
    applies_to_ref_years_before: 2025
    missing_reason: "municipio_inexistente_no_periodo"
    note: "Município instalado em 01/01/2025; ausente no Censo 2022 e em séries históricas anteriores a 2025."
  - cd_ibge: 5300108
    name: "Brasília"
    uf: "DF"
    applies_to_adapters: ["siconfi", "ckan"]
    missing_reason: "distrito_federal_regime_estadual"
    note: "O Distrito Federal acumula competências estaduais e municipais e não integra bases exclusivamente municipais do Tesouro (DCA municipal / CAPAG Municípios)."
  - cd_ibge: 2605459
    name: "Fernando de Noronha"
    uf: "PE"
    applies_to_adapters: ["siconfi", "ckan"]
    missing_reason: "distrito_estadual_sem_prefeitura"
    note: "Distrito estadual de Pernambuco sem prefeitura/câmara municipal; não declara DCA municipal nem possui nota CAPAG municipal."

