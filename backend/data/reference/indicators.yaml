    description: "População residente total do município recenseada no Censo Demográfico de 2022."
    theme: social
    tier: 1
    unit: "pessoas"
    value_type: continuous
    higher_is: neutral
    scale_hint: log
    valid_range: [500, 15000000]
    source:
      adapter: sidra
      params:
        table: 4709
        variable: 93
        period: "2022"
      name: "IBGE — Censo Demográfico 2022"
      url: "https://sidra.ibge.gov.br/tabela/4709"
      license: "Dados públicos (LAI)"
      citation: "IBGE. Censo Demográfico 2022: População residente."
    transform: null
    ref_year_policy: "fixed:2022"
    min_coverage: 0.999
    caveat: null
    verified: true

  - code: population_estimate
