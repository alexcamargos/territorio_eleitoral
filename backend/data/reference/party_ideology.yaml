# =============================================================================
# Classificação Ideológica Partidária — Fonte da Verdade (Território Eleitoral)
# =============================================================================
# Referência metodológica: docs/07-metodologia.md (§2) e docs/06-modelo-de-dados.md
#
# Regras de negócio inegociáveis:
# 1. Todo SG_PARTIDO presente nos arquivos de votação do TSE com total_votes > 0
#    DEVE possuir registro vigente (valid_from <= year e (valid_to is null ou year <= valid_to)).
#    Partido sem classificação vigente faz o pipeline falhar com UnclassifiedPartyError.
# 2. A escala contínua vai de 0.00 (extrema-esquerda) a 10.00 (extrema-direita):
#      - left:   0.00 <= score <  4.00 (Esquerda e centro-esquerda)
#      - center: 4.00 <= score <= 6.00 (Centro ideológico)
#      - right:  6.00 <  score <= 10.00 (Centro-direita e direita)
# 3. Métodos de atribuição permitidos (coluna party_ideology.method):
#      - survey:  nota direta do expert survey acadêmico de referência (ou partido renomeado)
#      - derived: fusão/incorporação calculada pela média ponderada pela bancada de
#                 deputados federais eleitos na eleição imediatamente anterior à fusão
#      - manual:  partido novo pós-survey sem antecessor parlamentar, classificado a
#                 partir do estatuto/programa registrado no TSE
# =============================================================================

schema_version: 1

source_citation: >-
  Bolognesi, B., Ribeiro, E., & Codato, A. (2023). Uma Nova Classificação
  Ideológica dos Partidos Políticos Brasileiros. Dados — Revista de Ciências
  Sociais, Rio de Janeiro, v. 66, n. 2, e20210164.
  https://doi.org/10.1590/dados.2023.66.2.303

thresholds:
  scale_min: 0.00
  scale_max: 10.00
  left_max_exclusive: 4.00
  right_min_exclusive: 6.00

blocs:
  left:
    label_pt: "Esquerda"
    description: "Esquerda e centro-esquerda (0,00 <= score < 4,00)"
  center:
    label_pt: "Centro"
    description: "Centro ideológico (4,00 <= score <= 6,00)"
  right:
    label_pt: "Direita"
    description: "Centro-direita e direita (6,00 < score <= 10,00)"

# Mapa de normalização de siglas históricas ou grafias alternativas do TSE
# para o party_code canônico (aplicado após upper().strip() e remoção de acentos).
aliases:
  "PC DO B": "PCDOB"
  "PCdoB": "PCDOB"
  "UNIÃO": "UNIAO"
  "UNIAO BRASIL": "UNIAO"
  "MISSÃO": "MISSAO"
  "PARTIDO MISSAO": "MISSAO"
  "PMDB": "MDB"
  "PPS": "CIDADANIA"
  "PR": "PL"
  "PRB": "REPUBLICANOS"
  "PTN": "PODE"
  "PODEMOS": "PODE"
  "PTC": "AGIR"
  "PMN": "MOBILIZA"
  "PSDC": "DC"
  "PTDOB": "AVANTE"
  "PT DO B": "AVANTE"
  "PMB": "DEMOCRATA"
  "SD": "SOLIDARIEDADE"
  "SDD": "SOLIDARIEDADE"
  "PROGRESSISTAS": "PP"
  "PPB": "PP"
  "PEN": "PATRIOTA"
  "PATRI": "PATRIOTA"
  "PFL": "DEM"

